<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="'Courier New', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A2BE2"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A2BE2"/>
      <stop offset="0.55" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A2BE2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#8A2BE2" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="typeClip">
      <rect class="typeclip" x="42" y="72" width="0" height="24"/>
    </clipPath>

    <style>
      @keyframes fadeUp { 0% { opacity: 0; transform: translateY(9px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes grow   { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
      @keyframes type   { 0% { width: 0; } 100% { width: 340px; } }
      @keyframes caret  { 0% { transform: translateX(0); opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(320px); opacity: 0; } }
      @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes flash  { 0% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes settle { 0% { opacity: 0; transform: translateY(-4px);} 100% { opacity: 1; transform: translateY(0);} }
      @keyframes glowIn { 0% { opacity: 0; } 100% { opacity: 1; } }

      .typeclip { animation: type 1.5s steps(28, end) 0.3s forwards; }
      .caret    { animation: caret 1.5s steps(28, end) 0.3s forwards; }
      .r        { opacity: 0; animation: fadeUp 0.5s ease-out forwards; }
      .fill     { transform: scaleX(0); transform-box: fill-box; transform-origin: left center; animation: grow 0.95s cubic-bezier(.2,.85,.25,1) forwards; }
      .blink    { animation: blink 1.05s step-end infinite; }
      .slot     { opacity: 0; animation: flash 0.16s ease-in-out forwards; }
      .slotEnd  { opacity: 0; animation: settle 0.35s ease-out forwards; }
      .banner   { opacity: 0; animation: settle 0.7s ease-out 6.9s forwards; }
      .glowEl   { opacity: 0; animation: glowIn 0.9s ease-out 6.9s forwards; }
    </style>
  </defs>

  <!-- window -->
  <rect x="16" y="16" width="868" height="508" rx="14" fill="#0d1117" stroke="#222a35" stroke-width="1.5"/>
  <rect x="16" y="16" width="868" height="508" rx="14" fill="url(#grid)"/>

  <!-- glow behind banner -->
  <ellipse class="glowEl" cx="300" cy="486" rx="360" ry="90" fill="url(#glow)"/>

  <!-- titlebar -->
  <circle cx="46" cy="40" r="6" fill="#ff5f56"/>
  <circle cx="68" cy="40" r="6" fill="#ffbd2e"/>
  <circle cx="90" cy="40" r="6" fill="#27c93f"/>
  <text x="450" y="45" text-anchor="middle" font-size="13" fill="#59636e">— wendel@ventura: ~/profile — zsh —</text>
  <line x1="16" y1="58" x2="884" y2="58" stroke="#222a35" stroke-width="1.5"/>

  <!-- typed command -->
  <g clip-path="url(#typeClip)">
    <text x="42" y="90" font-size="16">
      <tspan fill="#9ece6a">❯ </tspan><tspan fill="#c9d1d9">./boot_profile.sh --user=wendel</tspan>
    </text>
  </g>
  <rect class="caret" x="42" y="76" width="9" height="17" fill="#9ece6a"/>

  <!-- boot log -->
  <text class="r" style="animation-delay:2.0s" x="42" y="124" font-size="15"><tspan fill="#59636e">[</tspan><tspan fill="#9ece6a"> OK </tspan><tspan fill="#59636e">]</tspan><tspan fill="#c9d1d9">  inicializando data pipeline…</tspan></text>
  <text class="r" style="animation-delay:2.35s" x="42" y="150" font-size="15"><tspan fill="#59636e">[</tspan><tspan fill="#9ece6a"> OK </tspan><tspan fill="#59636e">]</tspan><tspan fill="#c9d1d9">  carregando runtime python 3.9…</tspan></text>
  <text class="r" style="animation-delay:2.7s" x="42" y="176" font-size="15"><tspan fill="#59636e">[</tspan><tspan fill="#9ece6a"> OK </tspan><tspan fill="#59636e">]</tspan><tspan fill="#c9d1d9">  conectando postgres · mysql · redshift…</tspan></text>
  <text class="r" style="animation-delay:3.05s" x="42" y="202" font-size="15"><tspan fill="#59636e">[</tspan><tspan fill="#9ece6a"> OK </tspan><tspan fill="#59636e">]</tspan><tspan fill="#c9d1d9">  montando aws s3 · rds…</tspan></text>
  <text class="r" style="animation-delay:3.4s" x="42" y="228" font-size="15"><tspan fill="#59636e">[</tspan><tspan fill="#9ece6a"> OK </tspan><tspan fill="#59636e">]</tspan><tspan fill="#c9d1d9">  aquecendo ml models · llms…</tspan></text>

  <!-- computing header -->
  <text class="r" style="animation-delay:3.85s" x="42" y="264" font-size="15" fill="#7dcfff">❯ computando perfil<tspan fill="#59636e"> …</tspan></text>

  <!-- progress bars -->
  <!-- python 100 -->
  <g class="r" style="animation-delay:4.15s">
    <text x="42" y="292" font-size="13" fill="#8b98a8">python</text>
    <rect x="170" y="283" width="360" height="11" rx="5.5" fill="#161d29"/>
    <rect class="fill" style="animation-delay:4.2s" x="170" y="283" width="360" height="11" rx="5.5" fill="url(#barFill)"/>
    <text x="548" y="292" font-size="13" fill="#9ece6a">100%</text>
  </g>
  <!-- sql/data 95 -->
  <g class="r" style="animation-delay:4.45s">
    <text x="42" y="318" font-size="13" fill="#8b98a8">sql &amp; data</text>
    <rect x="170" y="309" width="360" height="11" rx="5.5" fill="#161d29"/>
    <rect class="fill" style="animation-delay:4.5s" x="170" y="309" width="342" height="11" rx="5.5" fill="url(#barFill)"/>
    <text x="548" y="318" font-size="13" fill="#9ece6a">95%</text>
  </g>
  <!-- ml/ia 82 -->
  <g class="r" style="animation-delay:4.75s">
    <text x="42" y="344" font-size="13" fill="#8b98a8">ml &amp; ia</text>
    <rect x="170" y="335" width="360" height="11" rx="5.5" fill="#161d29"/>
    <rect class="fill" style="animation-delay:4.8s" x="170" y="335" width="295" height="11" rx="5.5" fill="url(#barFill)"/>
    <text x="548" y="344" font-size="13" fill="#bb9af7">82%</text>
  </g>
  <!-- aws/cloud 90 -->
  <g class="r" style="animation-delay:5.05s">
    <text x="42" y="370" font-size="13" fill="#8b98a8">aws / cloud</text>
    <rect x="170" y="361" width="360" height="11" rx="5.5" fill="#161d29"/>
    <rect class="fill" style="animation-delay:5.1s" x="170" y="361" width="324" height="11" rx="5.5" fill="url(#barFill)"/>
    <text x="548" y="370" font-size="13" fill="#9ece6a">90%</text>
  </g>

  <!-- computed metric with scrambling counter -->
  <g class="r" style="animation-delay:6.0s">
    <text x="42" y="404" font-size="14" fill="#59636e">❯<tspan fill="#8b98a8"> commits</tspan><tspan fill="#59636e"> ↑ </tspan></text>
    <text x="150" y="404" font-size="14" font-weight="bold" fill="#7dcfff"><tspan class="slot" style="animation-delay:6.9s" x="150">0341</tspan></text>
    <text x="150" y="404" font-size="14" font-weight="bold" fill="#7dcfff"><tspan class="slot" style="animation-delay:7.06s" x="150">0928</tspan></text>
    <text x="150" y="404" font-size="14" font-weight="bold" fill="#7dcfff"><tspan class="slot" style="animation-delay:7.22s" x="150">1204</tspan></text>
    <text x="150" y="404" font-size="14" font-weight="bold" fill="#7dcfff"><tspan class="slot" style="animation-delay:7.38s" x="150">1319</tspan></text>
    <text x="150" y="404" font-size="14" font-weight="bold" fill="#bb9af7"><tspan class="slotEnd" style="animation-delay:7.54s" x="150">1.337</tspan></text>
    <text x="205" y="404" font-size="14" fill="#8b98a8">· 42 pipelines · ∞ ☕</text>
  </g>

  <!-- success -->
  <text class="r" style="animation-delay:6.5s" x="42" y="436" font-size="15"><tspan fill="#9ece6a">✔</tspan><tspan fill="#c9d1d9">  perfil compilado com sucesso em </tspan><tspan fill="#9ece6a">0.42s</tspan></text>

  <!-- banner -->
  <g class="banner">
    <text x="42" y="486" font-size="36" font-weight="bold" fill="url(#nameGrad)" letter-spacing="1">WENDEL VENTURA</text>
    <text x="44" y="512" font-size="15" fill="#8b98a8">// Data Engineer · Machine Learning · IA Generativa<tspan class="blink" fill="#9ece6a"> ▊</tspan></text>
  </g>
</svg>
