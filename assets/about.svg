<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="'Courier New', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Sobre Wendel Ventura, saída de python3 sobre.py">
  <title>Wendel Ventura — sobre mim (python3 sobre.py)</title>
  <desc>Terminal animado revelando a classe Wendel(DataEngineer): nome, cargo, stack, bancos de dados, cloud, machine learning, missão e wendel.facts().</desc>
  <defs>
    <linearGradient id="aGrid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A2BE2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bb9af7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="agrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#8A2BE2" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="aTypeClip">
      <rect class="atypeclip" x="42" y="72" width="0" height="24"/>
    </clipPath>
    <style>
      @keyframes aFadeUp { 0% { opacity: 0; transform: translateY(7px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes aType   { 0% { width: 0; } 100% { width: 230px; } }
      @keyframes aCaret  { 0% { transform: translateX(0); opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(212px); opacity: 0; } }
      @keyframes aBlink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .atypeclip { animation: aType 1.0s steps(19, end) 0.3s forwards; }
      .acaret    { animation: aCaret 1.0s steps(19, end) 0.3s forwards; }
      .a         { opacity: 0; animation: aFadeUp 0.45s ease-out forwards; }
      .ablink    { animation: aBlink 1.05s step-end infinite; }
    </style>
  </defs>

  <!-- window -->
  <rect x="16" y="16" width="868" height="548" rx="14" fill="#0d1117" stroke="#222a35" stroke-width="1.5"/>
  <rect x="16" y="16" width="868" height="548" rx="14" fill="url(#agrid)"/>

  <!-- titlebar -->
  <circle cx="46" cy="40" r="6" fill="#ff5f56"/>
  <circle cx="68" cy="40" r="6" fill="#ffbd2e"/>
  <circle cx="90" cy="40" r="6" fill="#27c93f"/>
  <text x="450" y="45" text-anchor="middle" font-size="13" fill="#59636e">— wendel@ventura: ~/sobre — python3 —</text>
  <rect x="16" y="57" width="868" height="1.5" fill="url(#aGrid)"/>

  <!-- typed command -->
  <g clip-path="url(#aTypeClip)">
    <text x="42" y="90" font-size="16"><tspan fill="#9ece6a">❯ </tspan><tspan fill="#c9d1d9">python3 sobre.py</tspan></text>
  </g>
  <rect class="acaret" x="42" y="76" width="9" height="17" fill="#9ece6a"/>

  <!-- ===== class source (syntax highlighted) ===== -->
  <g font-size="15">
    <text class="a" style="animation-delay:1.7s" x="42" y="124"><tspan fill="#bb9af7">class </tspan><tspan fill="#7dcfff">Wendel</tspan><tspan fill="#89ddff">(</tspan><tspan fill="#7dcfff">DataEngineer</tspan><tspan fill="#89ddff">):</tspan></text>
    <text class="a" style="animation-delay:1.82s" x="42" y="146"><tspan fill="#565f89">    """dado como produto · código como pipeline"""</tspan></text>
    <text class="a" style="animation-delay:1.94s" x="42" y="170"><tspan fill="#7aa2f7">    nome       </tspan><tspan fill="#89ddff">= </tspan><tspan fill="#9ece6a">"Wendel Ventura"</tspan></text>
    <text class="a" style="animation-delay:2.06s" x="42" y="192"><tspan fill="#7aa2f7">    cargo      </tspan><tspan fill="#89ddff">= </tspan><tspan fill="#9ece6a">"Data Engineer · produção"</tspan></text>
    <text class="a" style="animation-delay:2.18s" x="42" y="214"><tspan fill="#7aa2f7">    local      </tspan><tspan fill="#89ddff">= </tspan><tspan fill="#9ece6a">"Brasil"</tspan></text>
    <text class="a" style="animation-delay:2.30s" x="42" y="236"><tspan fill="#7aa2f7">    stack      </tspan><tspan fill="#89ddff">= [</tspan><tspan fill="#9ece6a">"Python"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ece6a">"SQL"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ece6a">"React"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ece6a">"Node"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ece6a">"Power BI"</tspan><tspan fill="#89ddff">]</tspan></text>
    <text class="a" style="animation-delay:2.42s" x="42" y="258"><tspan fill="#7aa2f7">    dados      </tspan><tspan fill="#89ddff">= [</tspan><tspan fill="#9ece6a">"PostgreSQL"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ece6a">"MySQL"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ece6a">"Redshift"</tspan><tspan fill="#89ddff">]</tspan></text>
    <text class="a" style="animation-delay:2.54s" x="42" y="280"><tspan fill="#7aa2f7">    cloud      </tspan><tspan fill="#89ddff">= [</tspan><tspan fill="#9ece6a">"AWS S3"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ece6a">"AWS RDS"</tspan><tspan fill="#89ddff">]</tspan></text>
    <text class="a" style="animation-delay:2.66s" x="42" y="302"><tspan fill="#7aa2f7">    ml         </tspan><tspan fill="#89ddff">= [</tspan><tspan fill="#9ece6a">"scikit-learn"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ece6a">"PyTorch"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ece6a">"LLMs"</tspan><tspan fill="#89ddff">]</tspan></text>
    <text class="a" style="animation-delay:2.78s" x="42" y="324"><tspan fill="#7aa2f7">    aprendendo </tspan><tspan fill="#89ddff">= [</tspan><tspan fill="#9ece6a">"MLOps"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ece6a">"Arquitetura de dados"</tspan><tspan fill="#89ddff">]</tspan></text>
    <text class="a" style="animation-delay:2.90s" x="42" y="346"><tspan fill="#7aa2f7">    cafe       </tspan><tspan fill="#89ddff">= </tspan><tspan fill="#7dcfff">float</tspan><tspan fill="#89ddff">(</tspan><tspan fill="#9ece6a">"inf"</tspan><tspan fill="#89ddff">)</tspan></text>
    <text class="a" style="animation-delay:3.06s" x="42" y="380"><tspan fill="#bb9af7">    def </tspan><tspan fill="#7aa2f7">missao</tspan><tspan fill="#89ddff">(</tspan><tspan fill="#f7768e">self</tspan><tspan fill="#89ddff">) -> </tspan><tspan fill="#7dcfff">str</tspan><tspan fill="#89ddff">:</tspan></text>
    <text class="a" style="animation-delay:3.18s" x="42" y="402"><tspan fill="#bb9af7">        return </tspan><tspan fill="#9ece6a">"dados → decisões inteligentes e escaláveis"</tspan></text>
  </g>

  <!-- ===== printed facts ===== -->
  <text class="a" style="animation-delay:3.5s" x="42" y="438" font-size="15"><tspan fill="#9ece6a">❯ </tspan><tspan fill="#c9d1d9">wendel.facts()</tspan></text>
  <g font-size="14.5">
    <text class="a" style="animation-delay:3.68s" x="42" y="462"><tspan fill="#bb9af7">  ▹ </tspan><tspan fill="#8b95c9">automações financeiras + </tspan><tspan fill="#7dcfff">pipelines em produção</tspan></text>
    <text class="a" style="animation-delay:3.82s" x="42" y="484"><tspan fill="#bb9af7">  ▹ </tspan><tspan fill="#8b95c9">mergulhando em </tspan><tspan fill="#7dcfff">Data Science · Machine Learning · IA Generativa</tspan></text>
    <text class="a" style="animation-delay:3.96s" x="42" y="506"><tspan fill="#bb9af7">  ▹ </tspan><tspan fill="#8b95c9">brincando com </tspan><tspan fill="#bb9af7">LLMs</tspan><tspan fill="#8b95c9">, classificação, previsão e clustering</tspan></text>
    <text class="a" style="animation-delay:4.10s" x="42" y="528"><tspan fill="#bb9af7">  ▹ </tspan><tspan fill="#8b95c9">pergunte sobre </tspan><tspan fill="#9ece6a">Python · APIs REST · análise de dados · automação</tspan></text>
  </g>

  <!-- prompt + cursor -->
  <text class="a" style="animation-delay:4.3s" x="42" y="550" font-size="15"><tspan fill="#9ece6a">❯</tspan><tspan class="ablink" fill="#9ece6a"> ▊</tspan></text>
</svg>
