      @keyframes bl{0%,50%{opacity:1}51%,100%{opacity:0}}
      @keyframes scan{0%{transform:translateY(-24px);opacity:0}10%{opacity:.4}90%{opacity:.4}100%{transform:translateY(392px);opacity:0}}
    </style>
