      .blink{animation:bl 1.06s steps(1) infinite;}
      .scan{animation:scan 6.4s linear infinite;}
      @keyframes rv{to{opacity:1}}
      @keyframes br{to{opacity:1}}
      @keyframes fd{to{stroke-dashoffset:-240}}
      @keyframes pk{0%{opacity:0;transform:translateX(0)}12%{opacity:1}86%{opacity:1}100%{opacity:0;transform:translateX(96px)}}
